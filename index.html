<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7e8ff" />
    <title>Citas con Cata</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main id="app" class="app-shell" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="ideaDialog" class="modal">
      <form id="ideaForm" method="dialog" class="modal-card">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Idea de cita</p>
            <h2 id="ideaDialogTitle">Nueva idea</h2>
          </div>
          <button type="button" class="icon-button" data-close-modal aria-label="Cerrar">✕</button>
        </div>

        <input type="hidden" id="ideaId" />

        <label>
          Nombre del plan
          <input id="title" name="title" maxlength="80" required placeholder="Ej: Ir por helado y caminar" />
        </label>

        <div class="form-grid">
          <label>
            Categoría
            <input id="category" name="category" list="categoryList" placeholder="Comida, cine, naturaleza..." />
            <datalist id="categoryList"></datalist>
          </label>
          <label>
            Presupuesto
            <select id="budgetLevel" name="budgetLevel"></select>
          </label>
          <label>
            Energía requerida
            <select id="energyLevel" name="energyLevel"></select>
          </label>
          <label>
            Duración aprox.
            <input id="durationMinutes" name="durationMinutes" type="number" min="0" step="15" placeholder="90" />
          </label>
          <label>
            Repetir cada
            <input id="repeatEveryDays" name="repeatEveryDays" type="number" min="0" step="1" placeholder="30" />
            <small>Días sugeridos. 0 = sin frecuencia.</small>
          </label>
          <label>
            Lugar / modalidad
            <input id="locationType" name="locationType" maxlength="70" placeholder="Casa, Bogotá, cerca a Musicala..." />
          </label>
        </div>

        <label>
          Momento ideal
          <input id="idealMoment" name="idealMoment" maxlength="100" placeholder="Domingo lento, noche entre semana, después de trabajar..." />
        </label>

        <label>
          Etiquetas
          <input id="tags" name="tags" maxlength="160" placeholder="romántico, barato, cerca, lluvia" />
          <small>Separadas por coma. Sí, las comas sirven para algo distinto a respirar mal.</small>
        </label>

        <label>
          Descripción / detalles
          <textarea id="description" name="description" rows="4" maxlength="700" placeholder="Qué haríamos, qué comprar, dónde queda, links, notas..." ></textarea>
        </label>

        <div class="toggle-row">
          <label class="checkline">
            <input id="favorite" name="favorite" type="checkbox" />
            Favorita
          </label>
          <label class="checkline">
            <input id="archived" name="archived" type="checkbox" />
            Archivada
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="ghost" data-close-modal>Cancelar</button>
          <button type="submit" class="primary">Guardar idea</button>
        </div>
      </form>
    </dialog>

    <dialog id="logDialog" class="modal">
      <form id="logForm" method="dialog" class="modal-card">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Plan realizado</p>
            <h2 id="logDialogTitle">Marcar como hecho</h2>
          </div>
          <button type="button" class="icon-button" data-close-modal aria-label="Cerrar">✕</button>
        </div>

        <input type="hidden" id="logIdeaId" />

        <div class="form-grid">
          <label>
            Fecha
            <input id="dateAt" name="dateAt" type="datetime-local" required />
          </label>
          <label>
            Calificación
            <div class="star-rating" id="starRating" data-value="5">
              <button type="button" class="star" data-star="1" aria-label="1 estrella">★</button>
              <button type="button" class="star" data-star="2" aria-label="2 estrellas">★</button>
              <button type="button" class="star" data-star="3" aria-label="3 estrellas">★</button>
              <button type="button" class="star" data-star="4" aria-label="4 estrellas">★</button>
              <button type="button" class="star" data-star="5" aria-label="5 estrellas">★</button>
              <input type="hidden" id="rating" name="rating" value="5" />
            </div>
            <small id="ratingLabel">5 · repetir urgente</small>
          </label>
          <label>
            Mood
            <input id="mood" name="mood" maxlength="80" placeholder="Cansados pero felices" />
          </label>
          <label>
            Costo aprox.
            <input id="cost" name="cost" type="number" min="0" step="1000" placeholder="40000" />
          </label>
        </div>

        <label>
          Recuerdo / nota
          <textarea id="note" name="note" rows="4" maxlength="700" placeholder="Qué pasó, qué les gustó, qué repetirían..." ></textarea>
        </label>

        <div class="modal-actions">
          <button type="button" class="ghost" data-close-modal>Cancelar</button>
          <button type="submit" class="primary">Guardar recuerdo</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
